name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # LINT — client only (server has no lint script yet)
  # ─────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

  # ─────────────────────────────────────────
  # TEST — server, against real MongoDB + Redis
  # (mirrors tests/setup.js, which uses a live DB, not mocks)
  # ─────────────────────────────────────────
  test-server:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/photographer_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ci_test_secret_key_at_least_32_characters_long
      JWT_EXPIRES_IN: 7d
      JWT_COOKIE_EXPIRES_IN: "7"
      AWS_ACCESS_KEY_ID: ci-fake-access-key
      AWS_SECRET_ACCESS_KEY: ci-fake-secret-key
      AWS_BUCKET_NAME: ci-fake-bucket
      AWS_REGION: ap-south-1
      SMTP_EMAIL: ci@example.com
      SMTP_PASSWORD: ci-fake-app-password
      EMAIL_FROM: "CI Runner <ci@example.com>"
      RAZORPAY_KEY_ID: ci-fake-razorpay-key
      RAZORPAY_KEY_SECRET: ci-fake-razorpay-secret
      RAZORPAY_WEBHOOK_SECRET: ci-fake-webhook-secret
      ANTHROPIC_API_KEY: ci-fake-anthropic-key
      CLIENT_URL: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "100"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Run server test suite
        working-directory: server
        run: npm run test:coverage

  # ─────────────────────────────────────────
  # TEST — client (Vitest, no external services needed)
  # ─────────────────────────────────────────
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Run client test suite
        working-directory: client
        run: npm run test:coverage